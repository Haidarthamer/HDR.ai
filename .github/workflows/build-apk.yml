name: Build NexusAI APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-36.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare Firebase configuration for Google Sign-In
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -s app/google-services.json ]; then
            echo "Firebase config found at app/google-services.json."
          elif [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
            echo "Firebase config loaded from the GOOGLE_SERVICES_JSON repository secret."
          else
            echo "::warning title=Google Sign-In not configured::No app/google-services.json or GOOGLE_SERVICES_JSON secret found. The APK can still build for Guest Mode, but Google login will be unavailable."
            {
              echo "### Google Sign-In configuration missing"
              echo "This build can be used in Guest Mode, but Google login will not work until the Firebase Android config is provided."
              echo "Add `app/google-services.json` to the build source, or add a repository Actions secret named `GOOGLE_SERVICES_JSON` containing the full JSON file."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NexusAI-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

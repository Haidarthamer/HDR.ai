name: Build NexusAI APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-36.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare Firebase configuration
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -s app/google-services.json ]; then
            echo "Using app/google-services.json from the source tree."
          elif [ -n "${GOOGLE_SERVICES_JSON:-}" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
            echo "Loaded Firebase configuration from the GOOGLE_SERVICES_JSON Actions secret."
          else
            echo "::warning title=Firebase not configured::No app/google-services.json file or GOOGLE_SERVICES_JSON secret was provided. Authentication will not work in this APK; Guest Mode only."
            {
              echo "### Firebase configuration: MISSING"
              echo "This APK can build, but Google Sign-In and email/password account authentication cannot work until a real Firebase Android configuration is connected."
              echo "See [FIREBASE_SETUP.md](https://github.com/Haidarthamer/HDR.ai/blob/main/FIREBASE_SETUP.md) for setup."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

      - name: Validate Firebase configuration
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -s app/google-services.json ]; then
            echo "No Firebase config supplied; continuing with Guest Mode build."
            exit 0
          fi

          python3 - <<'PY'
          import json
          import sys

          path = "app/google-services.json"
          expected_package = "com.aistudio.nexusai.qkzvpx"

          try:
              with open(path, "r", encoding="utf-8") as f:
                  config = json.load(f)
          except Exception as exc:
              sys.exit(f"Firebase config is not valid JSON: {exc}")

          project = config.get("project_info") or {}
          if not project.get("project_id") or not project.get("project_number"):
              sys.exit("Firebase config is missing project_info.project_id or project_info.project_number.")

          clients = config.get("client") or []
          match = next(
              (
                  client for client in clients
                  if ((client.get("client_info") or {}).get("android_client_info") or {}).get("package_name")
                  == expected_package
              ),
              None,
          )
          if not match:
              actual = [
                  ((c.get("client_info") or {}).get("android_client_info") or {}).get("package_name")
                  for c in clients
              ]
              sys.exit(
                  f"Firebase config has no Android client for {expected_package}. "
                  f"Packages found: {actual}. Register the exact package name in Firebase and download a fresh JSON."
              )

          if not any(key.get("current_key") for key in (match.get("api_key") or [])):
              sys.exit("Firebase config has no API key for the matching Android app.")

          oauth_clients = match.get("oauth_client") or []
          has_web_client = any(
              str(client.get("client_type")) == "3" and client.get("client_id")
              for client in oauth_clients
          )
          if has_web_client:
              print("Firebase JSON is valid and the package name matches.")
              print("A Web OAuth client ID is present for Google Sign-In.")
              status = "Config valid; package matches; Web OAuth client ID found."
          else:
              print("::warning title=Google Sign-In incomplete::Firebase config matches the package, but no Web OAuth client ID (client_type 3) was found.")
              print("Email/password can still work if enabled in Firebase Authentication. Google Sign-In requires completing the Google provider setup and downloading a refreshed JSON.")
              status = "Config valid; package matches; Web OAuth client ID MISSING. Google Sign-In remains unconfigured."
          with open("/tmp/firebase-summary.txt", "w", encoding="utf-8") as f:
              f.write(status)
          PY

          {
            echo "### Firebase configuration: validated"
            cat /tmp/firebase-summary.txt
            echo
            echo "Validation checks the JSON structure, Firebase project metadata, API key, exact Android package, and Web OAuth client presence. Enable Email/Password and Google providers in Firebase Authentication separately."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Prepare stable CI debug signing (optional, recommended for Google Sign-In)
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
          ANDROID_DEBUG_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_DEBUG_KEYSTORE_PASSWORD }}
          ANDROID_DEBUG_KEY_ALIAS: ${{ secrets.ANDROID_DEBUG_KEY_ALIAS }}
          ANDROID_DEBUG_KEY_PASSWORD: ${{ secrets.ANDROID_DEBUG_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_DEBUG_KEYSTORE_BASE64:-}" ]; then
            if [ -n "${ANDROID_DEBUG_KEYSTORE_PASSWORD:-}" ] || [ -n "${ANDROID_DEBUG_KEY_ALIAS:-}" ] || [ -n "${ANDROID_DEBUG_KEY_PASSWORD:-}" ]; then
              echo "::error::Configure all four ANDROID_DEBUG_KEYSTORE_* secrets together; do not leave a partial signing setup."
              exit 1
            fi
            echo "::warning title=Stable signing not configured::This build uses a runner-generated debug certificate. Its SHA-1 can change on the next build, which may break Firebase Google Sign-In."
            {
              echo "### Android signing certificate"
              echo "A stable CI debug keystore is not configured. The SHA-1 fingerprint printed below may change on a future build. Configure the four ANDROID_DEBUG_KEYSTORE_* repository secrets as described in FIREBASE_SETUP.md for a stable Google Sign-In certificate."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [ -z "${ANDROID_DEBUG_KEYSTORE_PASSWORD:-}" ] || [ -z "${ANDROID_DEBUG_KEY_ALIAS:-}" ] || [ -z "${ANDROID_DEBUG_KEY_PASSWORD:-}" ]; then
            echo "::error::ANDROID_DEBUG_KEYSTORE_BASE64 requires ANDROID_DEBUG_KEYSTORE_PASSWORD, ANDROID_DEBUG_KEY_ALIAS, and ANDROID_DEBUG_KEY_PASSWORD."
            exit 1
          fi

          KEYSTORE_PATH="$RUNNER_TEMP/nexusai-ci-debug.keystore"
          printf '%s' "$ANDROID_DEBUG_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > "$KEYSTORE_PATH"
          keytool -list -keystore "$KEYSTORE_PATH" -storepass "$ANDROID_DEBUG_KEYSTORE_PASSWORD" -alias "$ANDROID_DEBUG_KEY_ALIAS" >/dev/null
          {
            echo "ANDROID_DEBUG_KEYSTORE_PATH=$KEYSTORE_PATH"
            echo "ANDROID_DEBUG_KEYSTORE_PASSWORD=$ANDROID_DEBUG_KEYSTORE_PASSWORD"
            echo "ANDROID_DEBUG_KEY_ALIAS=$ANDROID_DEBUG_KEY_ALIAS"
            echo "ANDROID_DEBUG_KEY_PASSWORD=$ANDROID_DEBUG_KEY_PASSWORD"
          } >> "$GITHUB_ENV"
          echo "Stable CI debug signing key validated and configured."

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Report APK signing certificate SHA-1
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          APKSIGNER="$(find "${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          if [ -z "$APKSIGNER" ] || [ ! -x "$APKSIGNER" ]; then
            echo "::warning::Could not locate apksigner to report APK certificate fingerprint."
            exit 0
          fi
          CERT_OUTPUT="$("$APKSIGNER" verify --print-certs "$APK")"
          SHA1="$(printf '%s\n' "$CERT_OUTPUT" | sed -n 's/.*certificate SHA-1 digest: //Ip' | head -n 1)"
          echo "APK signing certificate SHA-1: $SHA1"

          # Verify that the Firebase JSON includes an Android OAuth client for
          # the exact package and the certificate that actually signed this APK.
          OAUTH_SHA1_STATUS="not checked (Firebase JSON missing)"
          if [ -s app/google-services.json ]; then
            OAUTH_SHA1_STATUS="$(ACTUAL_SHA1="$SHA1" EXPECTED_PACKAGE="com.aistudio.nexusai.qkzvpx" python3 - <<'PY'
          import json
          import os

          actual_sha1 = os.environ.get("ACTUAL_SHA1", "").replace(":", "").strip().upper()
          expected_package = os.environ["EXPECTED_PACKAGE"]

          try:
              with open("app/google-services.json", "r", encoding="utf-8") as f:
                  config = json.load(f)
          except Exception:
              print("Firebase JSON could not be read")
              raise SystemExit(0)

          match = next(
              (
                  client for client in (config.get("client") or [])
                  if ((client.get("client_info") or {}).get("android_client_info") or {}).get("package_name")
                  == expected_package
              ),
              None,
          )

          android_oauth = (match or {}).get("oauth_client") or []
          configured_sha1s = {
              (client.get("android_info") or {}).get("certificate_hash", "").replace(":", "").strip().upper()
              for client in android_oauth
              if str(client.get("client_type")) == "1"
              and (client.get("android_info") or {}).get("package_name") == expected_package
          }
          if actual_sha1 and actual_sha1 in configured_sha1s:
              print("MATCH: Android OAuth certificate matches the APK signing certificate.")
          else:
              print("MISMATCH: No Android OAuth certificate matching the APK signing certificate was found in google-services.json.")
          PY
          )"
            echo "$OAUTH_SHA1_STATUS"
            if [[ "$OAUTH_SHA1_STATUS" == MISMATCH:* ]]; then
              echo "::warning title=Google Sign-In OAuth certificate mismatch::$OAUTH_SHA1_STATUS Google Sign-In may fail even though the APK build succeeds."
            fi
          fi

          {
            echo "### APK signing certificate SHA-1"
            echo "`$SHA1`"
            if [ -n "${ANDROID_DEBUG_KEYSTORE_PATH:-}" ]; then
              echo "This fingerprint uses the configured stable CI debug keystore."
            else
              echo "This fingerprint uses the runner-generated debug key and may change on a later build."
            fi
            echo
            echo "### Firebase Android OAuth certificate check"
            echo "$OAUTH_SHA1_STATUS"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NexusAI-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
